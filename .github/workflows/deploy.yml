name: Package deployment
on:
  push:
    tags: ["*"]
  workflow_dispatch:

jobs:
  build:
    name: Universal Build 📦
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14"]
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      test_version: ${{ steps.test-package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Build package
        run: |
          uv build
      - name: Extract package version
        id: package-version
        run: |
          uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" > VERSION
          echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build TestPyPI package
        id: test-package-version
        run: |
          TEST_VERSION="${{ steps.package-version.outputs.version }}.dev${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          uv version --frozen "$TEST_VERSION"
          uv build --out-dir dist-testpypi
          echo "version=$TEST_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: test-distribution
          path: dist-testpypi/

  publish-testpypi:
    name: Publish Python 🐍 distribution 📦 to Test-PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write

    steps:
      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.2.0
      - name: Download TestPyPI artifacts
        uses: actions/download-artifact@v8
        with:
          name: test-distribution
          path: dist-testpypi/
      - name: Publish
        run: uv publish -v --publish-url https://test.pypi.org/legacy/ dist-testpypi/*

  verify-installation:
    name: Cross-Platform 📦 validation from Test-PyPI
    needs:
      - build
      - publish-testpypi
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          # - "ubuntu-22.04-arm64"
        python-version:
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
      - name: Create Python environment
        run: uv venv --python "${{ matrix.python-version }}"
      - name: Waiting 10 seconds
        run: sleep 10
      - name: Install package from test-pypi
        run: |
          uv pip install -v --no-cache \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            --index-strategy unsafe-first-match \
            "fast-priority==${TEST_VERSION}"
        env:
          TEST_VERSION: ${{needs.build.outputs.test_version}}
      - name: Run API and Worker script
        run: |
          set +e
          FAST_PRIORITY_TARGET_BASE_URL="http://localhost:8001" timeout 5 uv run --no-project -v run-fast-priority
          rc=$?
          if [ $rc -eq 124 ]; then
            echo "API command timed out; ignoring timeout failure."
          elif [ $rc -ne 0 ]; then
            echo "API command failed with error code $rc."
            exit $rc
          fi
          FAST_PRIORITY_WORKERS=1 timeout 5 uv run --no-project -v run-fast-priority
          rc=$?
          if [ $rc -eq 124 ]; then
            echo "Worker command timed out; ignoring timeout failure."
          elif [ $rc -ne 0 ]; then
            echo "Worker command failed with error code $rc."
            exit $rc
          fi

  publish-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: verify-installation
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.2.0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/
      - name: Publish
        run: |
          uv publish -v dist/*

  publish-github:
    name: GitHub release 🦾
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install git-changelog
        run: uv tool install git-changelog
      - name: Prepare release notes
        run: git-changelog --release-notes > release-notes.md
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
